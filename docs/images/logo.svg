<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6fff6"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#04140d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>
  <!-- the shield -->
  <path filter="url(#drop)" fill="url(#shield)"
    d="M256 92 L384 140 V236 C384 318 330 388 256 416 C182 388 128 318 128 236 V140 Z"/>
  <!-- the check -->
  <path d="M196 258 L240 302 L320 214" fill="none" stroke="#0b5c43" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
