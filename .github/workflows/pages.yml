name: Deploy the web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A static site: the local preview needs nothing; chipnet mode reads deployments/chipnet.json.
      - run: npm run web:build
        env:
          CHIPNET_ELECTRUM_SERVER: chipnet.imaginary.cash
      # The submission videos, playable from the site.
      - run: mkdir -p web/out/media && cp docs/video/media/*.mp4 web/out/media/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      - id: deployment
        uses: actions/deploy-pages@v4
